# ============================================================
#  Configuración del bot — copia a config/config.yaml y ajusta.
#  Este archivo NO contiene secretos (esos van en .env).
# ============================================================

# Par a operar (formato MEXC spot, sin barra). Ej: BTCUSDT, ETHUSDT
symbol: BTCUSDT

# Intervalo de las velas para la estrategia.
# Valores válidos MEXC: 1m, 5m, 15m, 30m, 60m, 4h, 1d, 1M
interval: 15m

# Cada cuántos segundos revisa el mercado el bot.
poll_seconds: 60

# Ruta de la base de datos SQLite donde se guardan posiciones e historial.
# (La carpeta data/ está en .gitignore.)
db_path: data/bot.db

# ---------------- WebSocket (opcional) ----------------
# Si es true, el bot mantiene un feed de precios en tiempo real por WebSocket
# y comprueba el stop-loss y el trailing cada ~2 s con el último precio,
# en vez de esperar al siguiente poll. Si el feed se cae o no llegan datos
# frescos, el bot sigue funcionando solo con REST (sin riesgo añadido).
# Nota: MEXC está migrando su WebSocket a protobuf; si el canal JSON dejara
# de servir datos, ajusta websocket_url o desactívalo.
# websocket: true
# websocket_url: wss://wbs.mexc.com/ws

# ---------------- Estrategia ----------------
# Estrategias disponibles y sus parámetros (deja solo un bloque activo):
#
#   ma_crossover:  fast_period, slow_period        (cruce de medias)
#   rsi:           period, oversold, overbought    (reversión a la media)
#   macd:          fast, slow, signal              (momentum)
#   bollinger:     period, num_std                 (reversión por volatilidad)
#
strategy:
  name: ma_crossover          # nombre de la estrategia a cargar
  fast_period: 9              # media móvil rápida
  slow_period: 21             # media móvil lenta

# Ejemplos de las otras estrategias (comenta el bloque de arriba y usa uno):
# strategy:
#   name: rsi
#   period: 14
#   oversold: 30
#   overbought: 70
# strategy:
#   name: macd
#   fast: 12
#   slow: 26
#   signal: 9
# strategy:
#   name: bollinger
#   period: 20
#   num_std: 2.0

# ---------------- Gestión de riesgo ----------------
risk:
  # Capital (en moneda cotizada, ej USDT) a usar por operación.
  # Debe superar el mínimo del par (en MEXC suele ser ~5 USDT). El bot lo
  # verifica con exchangeInfo y omite la compra si no llega al mínimo.
  quote_per_trade: 20.0
  # Stop-loss y take-profit como fracción (0.02 = 2%).
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  # Máxima pérdida diaria permitida (en moneda cotizada). El bot se detiene si se alcanza.
  max_daily_loss: 50.0
  # Número máximo de posiciones abiertas simultáneas.
  max_open_positions: 1
  # Comisión del exchange por lado, como fracción (0.0005 = 0.05%, la tarifa
  # taker de MEXC spot). Se descuenta del PnL de cada operación en live, paper
  # y backtest. Ajústala a la de tu cuenta; 0 para ignorar comisiones.
  fee_pct: 0.0005
  # Trailing stop (opcional): si es > 0, el stop-loss sube siguiendo al precio
  # a esta distancia (0.015 = 1.5% por debajo del máximo alcanzado). Nunca
  # baja del nivel actual, así que con el avance del precio pasa a asegurar
  # beneficios. 0 = stop fijo. Pruébalo antes en el backtest con --trailing.
  trailing_stop_pct: 0.0
  # Dimensionado de la posición (sizing):
  #   fixed        -> usa quote_per_trade tal cual (por defecto).
  #   balance_pct  -> usa sizing_pct del balance disponible (0.1 = 10%).
  #   risk_pct     -> arriesga sizing_pct del balance por operación:
  #                   importe = balance * sizing_pct / stop_loss_pct
  #                   (ej. 0.01 con stop del 2% -> 50% del balance).
  # En live el balance es el saldo real de la moneda cotizada; en paper se usa
  # paper_balance más el PnL realizado (interés compuesto). Pruébalo antes en
  # el backtest con --sizing/--sizing-pct/--balance.
  sizing: fixed
  sizing_pct: 0.0
  # Capital simulado inicial (moneda cotizada) para paper/backtest.
  paper_balance: 1000.0

# ============================================================
#  RIESGO GLOBAL (opcional, recomendado con multi-bot)
# ============================================================
# Límites COMPARTIDOS entre todos los bots. Un valor de 0 = sin límite.
# Si defines esta sección, ningún bot podrá abrir una posición que haga
# superar estos topes combinados; y si se alcanza la pérdida diaria global,
# TODOS los bots dejan de abrir posiciones hasta el día siguiente.
#
# global_risk:
#   max_total_exposure: 100.0   # USDT máx. comprometidos a la vez (suma de bots)
#   max_daily_loss: 80.0        # pérdida diaria combinada máxima (USDT)
#   max_open_positions: 3       # posiciones abiertas simultáneas en total

# ============================================================
#  MULTI-BOT (opcional)
# ============================================================
# Para correr varias estrategias/pares en paralelo, define una lista `bots`.
# Cada bot hereda de la raíz (interval, poll_seconds, strategy, risk) lo que
# no especifique. Si defines `bots`, se ignora la `strategy` de la raíz.
# Cada bot guarda sus operaciones por separado (etiqueta `bot` en la BD) y
# aparece desglosado en el dashboard.
#
# bots:
#   - name: btc-tendencia          # nombre único (opcional; se genera si falta)
#     symbol: BTCUSDT
#     interval: 1h
#     strategy:
#       name: ma_crossover
#       fast_period: 9
#       slow_period: 21
#     risk:
#       quote_per_trade: 20.0
#       max_open_positions: 1
#   - name: eth-reversion
#     symbol: ETHUSDT
#     interval: 15m
#     strategy:
#       name: rsi
#       period: 14
#     risk:
#       quote_per_trade: 15.0
#       stop_loss_pct: 0.015
