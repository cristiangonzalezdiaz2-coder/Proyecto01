# ============================================================
#  Configuración del bot — copia a config/config.yaml y ajusta.
#  Este archivo NO contiene secretos (esos van en .env).
# ============================================================

# Par a operar (formato MEXC spot, sin barra). Ej: BTCUSDT, ETHUSDT
symbol: BTCUSDT

# Intervalo de las velas para la estrategia.
# Valores válidos MEXC: 1m, 5m, 15m, 30m, 60m, 4h, 1d, 1M
interval: 15m

# Cada cuántos segundos revisa el mercado el bot.
poll_seconds: 60

# Ruta de la base de datos SQLite donde se guardan posiciones e historial.
# (La carpeta data/ está en .gitignore.)
db_path: data/bot.db

# ---------------- Estrategia ----------------
# Estrategias disponibles y sus parámetros (deja solo un bloque activo):
#
#   ma_crossover:  fast_period, slow_period        (cruce de medias)
#   rsi:           period, oversold, overbought    (reversión a la media)
#   macd:          fast, slow, signal              (momentum)
#   bollinger:     period, num_std                 (reversión por volatilidad)
#
strategy:
  name: ma_crossover          # nombre de la estrategia a cargar
  fast_period: 9              # media móvil rápida
  slow_period: 21             # media móvil lenta

# Ejemplos de las otras estrategias (comenta el bloque de arriba y usa uno):
# strategy:
#   name: rsi
#   period: 14
#   oversold: 30
#   overbought: 70
# strategy:
#   name: macd
#   fast: 12
#   slow: 26
#   signal: 9
# strategy:
#   name: bollinger
#   period: 20
#   num_std: 2.0

# ---------------- Gestión de riesgo ----------------
risk:
  # Capital (en moneda cotizada, ej USDT) a usar por operación.
  # Debe superar el mínimo del par (en MEXC suele ser ~5 USDT). El bot lo
  # verifica con exchangeInfo y omite la compra si no llega al mínimo.
  quote_per_trade: 20.0
  # Stop-loss y take-profit como fracción (0.02 = 2%).
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  # Máxima pérdida diaria permitida (en moneda cotizada). El bot se detiene si se alcanza.
  max_daily_loss: 50.0
  # Número máximo de posiciones abiertas simultáneas.
  max_open_positions: 1
